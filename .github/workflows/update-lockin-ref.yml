name: Update Lockin referral link

on:
  push:
    paths:
      - '.github/workflows/update-lockin-ref.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace app links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          old = 'https://t.me/tradeonlockinbot'
          new = 'https://lockin.cash/r/Grinfluence'
          text = p.read_text()
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 app links, found {count}; refusing to modify.')
          p.write_text(text.replace(old, new))
          print(f'Replaced {count} app links.')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Lockin app referral link"
          git push
